[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  # Sem isso, o Nitro tenta empacotar pra Cloudflare (padrão do template Lovable)
  # e o deploy na Netlify quebra ou fica incompleto.
  NITRO_PRESET = "netlify"
  NODE_VERSION = "22"

# Garante que o preview de PRs/branches também usa o preset certo
[context.deploy-preview.environment]
  NITRO_PRESET = "netlify"

[context.branch-deploy.environment]
  NITRO_PRESET = "netlify"
